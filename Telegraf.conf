[agent]
  interval = "10s"                # Collection interval; lower for faster but higher CPU.
  flush_interval = "1s"           # Flush batches quickly.
  metric_batch_size = 50000       # Large batches for high throughput; tune up to 100000 if RAM allows.
  metric_buffer_limit = 500000    # Buffer for bursts; scale with your 60GB RAM.
  quiet = false                   # Log progress; set true for less output.

[[inputs.file]]
  alias = "sensor_data"           # Measurement name (customize if needed).
  files = ["C:\\path\\to\\your_10tb.csv"]  # Replace with your CSV path; use array for multiple files.
  data_format = "csv"
  file_tag = "sensor"             # Adds tag "sensor" with the filename as value.

  # CSV Parser Options (tailored to your sample)
  csv_header_row_count = 1        # Use first row as headers ("Timestamp", "Value").
  csv_skip_rows = 0               # No rows to skip before header.
  csv_delimiter = ","             # Standard comma.
  csv_comment = "#"               # Skip lines starting with # (if any).
  csv_trim_space = true           # Trim whitespace.
  csv_measurement_column = ""     # No column; uses alias above.
  csv_tag_columns = []            # No additional tags from columns.
  csv_timestamp_column = "Timestamp"
  csv_timestamp_format = "2006-01-02 15:04:05"  # Matches your YYYY-MM-DD HH:MM:SS.
  csv_skip_errors = true          # Skip bad rows to avoid halting on 10TB.
  csv_skip_values = [""]          # Ignore empty values.

# Processor to rename the field from "Value" to "value"
[[processors.rename]]
  [[processors.rename.replace]]
    field = "Value"
    dest = "value"

[[outputs.influxdb_v2]]
  urls = ["http://localhost:8086"]  # Your local InfluxDB.
  token = "your_token"              # Replace with your InfluxDB API token.
  organization = "your_org"         # Replace.
  bucket = "PGDP"                   # Your specified bucket.